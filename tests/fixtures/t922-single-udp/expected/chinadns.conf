bind-addr 127.0.0.1
bind-port 31053
china-dns 223.5.5.5,114.114.114.114
trust-dns udp://127.0.0.1#31082
ipset-name4 inet@aetherproxy@chnroute4
ipset-name6 null
gfwlist-file /etc/aether-proxy/data/gfwlist.txt
chnlist-file /etc/aether-proxy/data/chnlist.txt,/etc/aether-proxy/data/apple.txt
default-tag none
group uproxy
group-dnl /etc/aether-proxy/custom/proxy_domain.txt
group-upstream udp://127.0.0.1#31082
group-ipset inet@aetherproxy@uproxy4,null
group udirect
group-dnl /etc/aether-proxy/custom/direct_domain.txt
group-upstream 223.5.5.5,114.114.114.114
group-ipset inet@aetherproxy@udirect4,null
group boot
group-dnl /var/run/aether-proxy/boot.txt
group-upstream 223.5.5.5,114.114.114.114
no-ipv6
filter-qtype 65
cache 4096
cache-stale 3600
verdict-cache 4096
