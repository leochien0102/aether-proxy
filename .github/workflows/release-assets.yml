name: Release assets
run-name: Release assets ${{ inputs.tag || github.ref_name }}${{ inputs.dry_run && ' (dry-run)' || '' }}

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+-r[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing formal tag (vVERSION-rN)
        required: true
        type: string
      dry_run:
        description: Stage directly from gate artifacts without creating/updating a Release
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: release-assets-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-assets:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: workflow-source
          persist-credentials: false
      - name: Validate formal tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$ ]] || { echo 'Expected a formal vVERSION-rN tag' >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          path: release-source
          persist-credentials: false
      - name: Resolve the tag commit and check whether stable already has the Release
        id: route
        working-directory: release-source
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          [[ $(git rev-parse HEAD) == "$sha" ]]
          echo "BUILD_SHA=$sha" >> "$GITHUB_ENV"
          if [[ "$DRY_RUN" == true ]]; then
            echo 'mode=direct' >> "$GITHUB_OUTPUT"
          else
            python3 ../workflow-source/tools/release/verify.py publication-route "$GH_REPO" "$TAG" "$sha" >> "$GITHUB_OUTPUT"
          fi
      - name: Select the exact successful gate run (direct)
        if: steps.route.outputs.mode == 'direct'
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python3 workflow-source/tools/release/gate.py --sha "$BUILD_SHA" --repo "$GH_REPO" \
            | tee -a "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.route.outputs.mode == 'direct'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.gate.outputs.run_id }}
          artifact-ids: ${{ steps.gate.outputs.artifact_ids }}
          merge-multiple: false
          path: release-source/artifacts
      - name: Stage the 18 formal package assets (direct)
        if: steps.route.outputs.mode == 'direct'
        working-directory: release-source
        shell: bash
        run: |
          set -euo pipefail
          python3 ../workflow-source/tools/release/stage.py
      - name: Print the package inventory and verify SHA256SUMS
        if: steps.route.outputs.mode == 'direct'
        working-directory: release-source
        shell: bash
        run: |
          set -euo pipefail
          echo 'Publication route: direct'
          cat SHA256SUMS
          (cd release-assets && sha256sum --check --strict ../SHA256SUMS)
      - name: Check that direct packages do not conflict with published bytes
        if: ${{ steps.route.outputs.mode == 'direct' && !inputs.dry_run }}
        working-directory: release-source
        shell: bash
        run: |
          set -euo pipefail
          python3 ../workflow-source/tools/release/verify.py check-direct "$GH_REPO" "$TAG"
      - name: Publish the verified Release (never overwrite assets)
        if: ${{ steps.route.outputs.mode == 'direct' && !inputs.dry_run }}
        working-directory: release-source
        shell: bash
        run: |
          set -euo pipefail
          version=${TAG#v}
          notes="docs/releases/$version.md"
          test -s "$notes"
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' > existing-tags
          if grep -Fxq "$TAG" existing-tags; then
            [[ $(gh release view "$TAG" --json isDraft,isPrerelease -q '.isDraft or .isPrerelease') == false ]]
            gh release download "$TAG" -D existing-release
            diff -qr release-assets existing-release
          else
            if grep -Fq '<!-- aether-release-inventory-v1' "$notes"; then
              echo 'Release notes use a reserved inventory marker' >&2
              exit 1
            fi
            {
              cat "$notes"
              printf '\n\n<!-- aether-release-inventory-v1\n'
              cat release-inventory.json
              printf '%s\n' '-->'
            } > publish-notes.md
            gh release create "$TAG" release-assets/* --verify-tag --title "aether-proxy $version" --notes-file publish-notes.md
          fi
          gh release view "$TAG" --json url -q .url
      - name: Report the already published Release
        if: steps.route.outputs.mode == 'channel'
        run: echo 'The formal Release and stable assets already match; no changes needed.'
