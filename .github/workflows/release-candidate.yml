name: Release candidate

on:
  push:
    tags: ['v*-rc*']

permissions:
  contents: read
  actions: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve tag and select successful gate artifacts (never rebuild)
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          BUILD_SHA=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          echo "BUILD_SHA=$BUILD_SHA" >> "$GITHUB_ENV"
          python3 tools/release/gate.py --sha "$BUILD_SHA" --repo "$GH_REPO" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.gate.outputs.run_id }}
          artifact-ids: ${{ steps.gate.outputs.artifact_ids }}
          merge-multiple: false
          path: artifacts
      - name: Validate candidate and stage immutable assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release/stage.py
      - name: Create prerelease only after all validation succeeds
        shell: bash
        run: |
          set -euo pipefail
          # Never mutate an existing release, including a partial previous attempt.
          gh api "repos/$GH_REPO/releases?per_page=100" > releases.json
          python3 - <<'PY'
          import json, os
          if any(r['tag_name'] == os.environ['TAG'] for r in json.load(open('releases.json'))):
              raise SystemExit('RC release already exists; refusing replacement')
          PY
          gh release create "$TAG" rc-assets/* --verify-tag --prerelease --latest=false \
            --title "aether-proxy $TAG" --notes 'Immutable RC packages; see rc-manifest.json and SHA256SUMS. Promote without rebuilding.'
