name: test

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bootstrap.sh itself needs only git, cmake, make, gcc and pkg-config; it
      # builds json-c from source when the system lacks it. Installing the
      # system package here just saves that build.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libjson-c-dev

      - name: Compute component revisions
        id: revs
        run: echo "revs=$(bash tests/host/bootstrap.sh --revs)" >> "$GITHUB_OUTPUT"

      - name: Cache host prefix
        uses: actions/cache@v4
        with:
          path: tests/host/prefix
          key: host-prefix-${{ runner.os }}-${{ steps.revs.outputs.revs }}-${{ hashFiles('tests/host/bootstrap.sh') }}

      - name: Bootstrap libubox / uci / ucode
        run: bash tests/host/bootstrap.sh

      - name: Run tests
        run: tests/host/ucode tests/run.uc

      - name: Run CLI scenario tests
        run: bash tests/cli/run.sh

      - name: Run daemon lifecycle tests
        run: bash tests/daemon/run.sh

      - name: Run monitor integration tests
        run: bash tests/monitor/run.sh

      - name: Run reload integration tests
        run: bash tests/reload/run.sh

      - name: Test rule-data generator
        run: python3 -m unittest tools/data/test_build.py

  # Real-tool validation of the golden files. Logic lives in tests/ci/*.sh so it can be run
  # locally. Versions come from aether-proxy/src/lib/const.uc; nothing is duplicated here.
  validate-xray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: xray run -test on every expected/xray.json
        run: bash tests/ci/xray.sh

  validate-nft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nftables
        run: sudo apt-get update && sudo apt-get install -y nftables
      - name: nft -c -f on every expected/aether-proxy.nft
        run: bash tests/ci/nft.sh

  validate-chinadns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nftables
        run: sudo apt-get update && sudo apt-get install -y nftables
      - name: chinadns-ng -C on every expected/chinadns.conf
        run: bash tests/ci/chinadns.sh
