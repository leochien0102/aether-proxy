name: test

on:
  # Tag pushes point at a commit that was already tested on main; the release
  # workflow reuses that commit, so re-running the suites there adds time for nothing.
  push:
    branches: [main]
    paths:
      - 'aether-proxy/**'
      - 'luci-app-aether-proxy/**'
      - 'chinadns-ng/**'
      - 'aether-xray/**'
      - 'aether-dns/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/test.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/release-component.yml'
      - '.github/workflows/release-assets.yml'
  pull_request:
    paths:
      - 'aether-proxy/**'
      - 'luci-app-aether-proxy/**'
      - 'chinadns-ng/**'
      - 'aether-xray/**'
      - 'aether-dns/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/test.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/release-component.yml'
      - '.github/workflows/release-assets.yml'

jobs:
  host-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout paired channel contracts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: leochien0102/aether-proxy-channel
          ref: b064da02c5fc50a6fb71338ae8b19c420c121e08
          path: .ci-channel
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install CI contract test dependencies
        run: python3 -m pip install PyYAML

      - name: Run CI contract tests
        env:
          CHANNEL_WORKTREE: ${{ github.workspace }}/.ci-channel
        run: |
          set -euo pipefail
          test -d "$CHANNEL_WORKTREE"
          test "$(git -C "$CHANNEL_WORKTREE" rev-parse HEAD)" = b064da02c5fc50a6fb71338ae8b19c420c121e08
          test -f "$CHANNEL_WORKTREE/.github/workflows/publish-channel.yml"
          python3 tests/ci/test_build_scope.py
          python3 tests/ci/test_component_assets.py
          python3 tests/ci/test_release_paths.py

      # bootstrap.sh itself needs only git, cmake, make, gcc and pkg-config; it
      # builds json-c from source when the system lacks it. Installing the
      # system package here just saves that build.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libjson-c-dev

      - name: Compute component revisions
        id: revs
        run: echo "revs=$(bash tests/host/bootstrap.sh --revs)" >> "$GITHUB_OUTPUT"

      - name: Cache host prefix
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tests/host/prefix
          key: host-prefix-${{ runner.os }}-${{ steps.revs.outputs.revs }}-${{ hashFiles('tests/host/bootstrap.sh') }}

      - name: Bootstrap libubox / uci / ucode
        run: bash tests/host/bootstrap.sh

      - name: Run tests
        run: tests/host/ucode tests/run.uc

      - name: Run CLI scenario tests
        run: bash tests/cli/run.sh

      - name: Run traffic stats tests
        run: bash tests/stats/run.sh

      - name: Run status notices tests
        run: bash tests/status/run.sh

      - name: Run log / node import / custom tests
        run: bash tests/node/run.sh

      - name: Run daemon lifecycle tests
        run: bash tests/daemon/run.sh

      - name: Run monitor integration tests
        run: bash tests/monitor/run.sh

      - name: Run reload integration tests
        run: bash tests/reload/run.sh

      - name: Run init script tests
        run: bash tests/stubs/procd/run.sh

      - name: Run subscription status and page tests
        run: bash tests/sub-status/run.sh

      - name: Run subscription update tests
        run: bash tests/sub/run.sh

      - name: Run job mechanism tests
        run: bash tests/job/run.sh

      - name: Run rpcd plugin tests
        run: bash tests/rpcd/run.sh

      - name: Run node probe tests
        run: bash tests/probe/run.sh

      - name: Run LuCI JS tests
        run: bash tests/luci/run.sh

      - name: Run subscription schedule tests
        run: bash tests/schedule/run.sh

      - name: Run rules and DNS tests
        run: bash tests/rules/run.sh

      - name: Run update check tests
        run: bash tests/update/run.sh

      - name: Run previous-release update compatibility tests
        run: bash tests/compat/run.sh

      - name: Test rule-data generator
        run: python3 -m unittest tools/data/test_build.py

      - name: Test release-channel builder
        run: python3 -m unittest discover tools/channel

  # Real-tool validation of the golden files. Logic lives in tests/ci/*.sh so it can be run
  # locally. Versions come from aether-proxy/src/lib/const.uc; nothing is duplicated here.
  validate-xray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: xray run -test on every expected/xray.json
        run: bash tests/ci/xray.sh

  validate-nft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install nftables
        run: sudo apt-get update && sudo apt-get install -y nftables
      - name: nft -c -f on every expected/aether-proxy.nft
        run: bash tests/ci/nft.sh

  validate-chinadns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install nftables
        run: sudo apt-get update && sudo apt-get install -y nftables
      - name: chinadns-ng -C on every expected/chinadns.conf
        run: bash tests/ci/chinadns.sh
